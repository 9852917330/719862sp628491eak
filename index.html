<body>
  <div class="app-shell">
    <section class="practice-screen" aria-label="Speaking practice">
      <header class="topbar">
        <div class="brand"><span class="brand-mark">SS</span><span class="brand-name">SpeakSharp</span></div>
        <button id="apiKeyBtn" class="ghost-btn compact" type="button">API key</button>
      </header>

      <nav class="mode-tabs" aria-label="Practice mode">
        <button class="mode-card active" data-mode="instant" type="button"><span class="mode-icon">⚡</span><span>Instant</span></button>
        <button class="mode-card" data-mode="random" type="button"><span class="mode-icon">🎲</span><span>Random</span></button>
        <button class="mode-card" data-mode="ielts" type="button"><span class="mode-icon">🎓</span><span>IELTS</span></button>
        <button class="mode-card" data-mode="thought" type="button"><span class="mode-icon">🧠</span><span>Thought</span></button>
      </nav>

      <div class="control-row">
        <div class="select-wrap" id="ieltsPartWrap" hidden>
          <label for="ieltsPart">IELTS part</label>
          <select id="ieltsPart" aria-label="IELTS part"><option value="1">Part 1</option><option value="2">Part 2</option><option value="3">Part 3</option></select>
        </div>
        <div class="select-wrap">
          <label for="timeLimit">Time limit</label>
          <select id="timeLimit" aria-label="Time limit"><option value="30">30 sec</option><option value="60" selected>60 sec</option><option value="90">90 sec</option><option value="120">120 sec</option></select>
        </div>
        <button id="randomBtn" class="ghost-btn new-prompt grow" type="button">↻ New question</button>
      </div>

      <section class="practice-core">
        <div class="prompt-wrap">
          <div class="prompt-meta" id="promptMeta">INSTANT RESPONSE</div>
          <div class="prompt" id="promptText" aria-live="polite"></div>
          <div class="cue-list" id="cueList"></div>
        </div>
        <div class="speak-stage">
          <div class="timer-wrap"><div id="timer" class="timer">01:00</div><div id="timerLabel" class="timer-label">READY</div></div>
          <button id="recordBtn" class="record-btn" type="button" aria-label="Start recording"><span class="record-dot"></span><span id="recordBtnText">START</span></button>
          <p class="stage-note" id="microcopy">Tap START. Instant mode reveals the question at GO.</p>
        </div>
      </section>

      <div id="recordedPanel" class="recorded-panel hidden">
        <audio id="playback" controls preload="metadata"></audio>
        <div class="metric-strip" id="localMetrics"></div>
        <div class="action-row"><button id="retryBtn" class="ghost-btn" type="button">Again</button><button id="gradeBtn" class="primary-btn" type="button">AI GRADE</button></div>
        <div id="gradeStatus" class="status" role="status" aria-live="polite"></div>
      </div>
    </section>

    <section id="resultSection" class="result-section hidden" aria-live="polite">
      <div class="result-head">
        <div><div class="eyebrow">DETAILED AI GRADE</div><h2 id="resultHeadline">Speaking report</h2><p id="resultSummary" class="result-summary"></p></div>
        <div class="band-badge"><span>IELTS est.</span><strong id="bandScore">—</strong></div>
      </div>
      <div class="score-grid" id="scoreGrid"></div>
      <div class="delivery-grid" id="deliveryMetrics"></div>
      <div class="report-grid">
        <article class="report-card wide"><h3>Criterion-by-criterion feedback</h3><div id="criterionFeedback" class="criterion-list"></div></article>
        <article class="report-card"><h3>Transcript</h3><p id="transcriptText" class="transcript"></p></article>
        <article class="report-card"><h3>What worked</h3><ul id="strengthList"></ul></article>
        <article class="report-card wide"><h3>Highest-value fixes</h3><div id="issueList" class="issue-list"></div></article>
        <article class="report-card"><h3>Better version — same meaning</h3><p id="betterAnswer"></p></article>
        <article class="report-card"><h3>Band 9-style version</h3><p id="band9Answer"></p></article>
      </div>
      <div class="action-row result-actions"><button id="samePromptBtn" class="ghost-btn" type="button">Try same question</button><button id="nextPromptBtn" class="primary-btn" type="button">Next question →</button></div>
    </section>

    <div class="hidden-maintenance" aria-hidden="true"><div id="progressStats"></div><div id="historyList"></div><button id="clearHistoryBtn" type="button">Clear</button></div>
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  async function convertAndMeasure(blob, targetRate) {
    const ab = await blob.arrayBuffer();
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    if (!AudioCtx) throw new Error('Audio processing is not supported in this browser.');
    const ctx = new AudioCtx();
    let buffer;
    try { buffer = await ctx.decodeAudioData(ab.slice(0)); }
    finally { await ctx.close().catch(() => {}); }

    const mono = mixToMono(buffer);
    const resampled = resampleLinear(mono, buffer.sampleRate, targetRate);
    const metrics = analyzeSpeech(resampled, targetRate);
    const wavBuffer = encodeWav16(resampled, targetRate);
    return { wavBlob: new Blob([wavBuffer], { type: 'audio/wav' }), metrics };

  function mixToMono(buffer) {
    const out = new Float32Array(buffer.length);
    const channels = buffer.numberOfChannels;
    for (let c = 0; c < channels; c++) {
      const data = buffer.getChannelData(c);
      for (let i = 0; i < data.length; i++) out[i] += data[i] / channels;
    }
    return out;
  }

  function resampleLinear(input, fromRate, toRate) {
    if (fromRate === toRate) return input;
    const ratio = fromRate / toRate;
    const length = Math.max(1, Math.round(input.length / ratio));
    const out = new Float32Array(length);
    for (let i = 0; i < length; i++) {
      const src = i * ratio;
      const lo = Math.floor(src), hi = Math.min(input.length - 1, lo + 1), frac = src - lo;
      out[i] = input[lo] * (1 - frac) + input[hi] * frac;
    }
    return out;
  }

  function analyzeSpeech(samples, rate) {
    const frameMs = 20;
    const frame = Math.max(1, Math.round(rate * frameMs / 1000));
    const rms = [];
    for (let i = 0; i < samples.length; i += frame) {
      let sum = 0, count = 0;
      for (let j = i; j < Math.min(samples.length, i + frame); j++) { sum += samples[j] * samples[j]; count++; }
      rms.push(Math.sqrt(sum / Math.max(1, count)));
    }
    const sorted = [...rms].sort((a,b) => a-b);
    const p20 = sorted[Math.floor(sorted.length * .2)] || 0;
    const p75 = sorted[Math.floor(sorted.length * .75)] || .02;
    const threshold = clamp(Math.max(.009, p20 * 2.8, p75 * .18), .009, .055);
    let active = rms.map(v => v > threshold);

    // Fill tiny gaps (<120ms) and remove tiny bursts (<100ms).
    active = smoothFlags(active, Math.round(120 / frameMs), false, true);
    active = smoothFlags(active, Math.round(100 / frameMs), true, false);

    const first = active.indexOf(true);
    const last = active.lastIndexOf(true);
    const duration = samples.length / rate;
    if (first < 0 || last < 0) return { duration, responseLatency: null, longPauses: 0, silenceRatio: 1, speechSpan: 0 };

    let longPauses = 0, gap = 0, silentFramesInside = 0;
    for (let i = first; i <= last; i++) {
      if (!active[i]) { gap++; silentFramesInside++; }
      else {
        if (gap * frameMs >= 800) longPauses++;
        gap = 0;
      }
    }
    if (gap * frameMs >= 800) longPauses++;
    const speechSpan = (last - first + 1) * frameMs / 1000;
    return {
      duration: Number(duration.toFixed(1)),
      responseLatency: Number((first * frameMs / 1000).toFixed(2)),
      longPauses,
      silenceRatio: Number((silentFramesInside / Math.max(1, last - first + 1)).toFixed(3)),
      speechSpan: Number(speechSpan.toFixed(1))
    };
  }

  function smoothFlags(flags, maxRun, targetValue, replacement) {
    const out = [...flags];
    let start = 0;
    while (start < out.length) {
      const val = out[start];
      let end = start + 1;
      while (end < out.length && out[end] === val) end++;
      if (val === targetValue && end - start <= maxRun) {
        for (let i = start; i < end; i++) out[i] = replacement;
      }
      start = end;
    }
    return out;
  }

  function encodeWav16(samples, sampleRate) {
    const buffer = new ArrayBuffer(44 + samples.length * 2);
    const view = new DataView(buffer);
    const write = (offset, str) => { for (let i = 0; i < str.length; i++) view.setUint8(offset + i, str.charCodeAt(i)); };

      view.setInt16(offset, s < 0 ? s * 0x8000 : s * 0x7fff, true);

    return buffer;

8 dimensions plus the measured delivery metrics.\n- This is training feedback, not an official IELTS result.\n\nDETAILED FEEDBACK RULES\n1. Transcribe exactly what the speaker says; preserve meaningful fillers, false starts and self-corrections. Do not silently fix grammar.\n2. For EVERY one of the 8 dimensions return: a concise verdict, one short exact evidence fragment from the transcript when possible, and one concrete nextStep. If evidence is mainly acoustic, describe only what is clearly audible.\n3. Return 2-5 specific strengths.\n4. Return up to 8 highest-value issues. Each issue must contain a short exact evidence fragment when possible and a practical fix. Prioritize recurring/high-impact problems over tiny slips.\n5. pronunciationDetails must separately address intelligibility, soundsFinals, stressRhythm, and connectedSpeech. Be careful and never fabricate sound errors.\n6. betterAnswer must preserve the speaker's intended meaning, correct the weaknesses, and remain realistic for the same time limit.\n7. band9Answer must be a natural high-level model answer, not a memorized essay, and proportionate to the time limit.\n8. fillerWords must contain fillers actually heard, not generic examples.\n9. summary must be blunt, diagnostic and under 55 words.\n\nReturn ONLY valid JSON with exactly this shape:\n{\n  "transcript":"",\n  "summary":"",\n  "estimatedBand":0,\n  "overallScore":0,\n  "scores":{\n    "fluencyCoherence":0,\n    "lexicalResource":0,\n    "grammar":0,\n    "pronunciation":0,\n    "ideaDevelopment":0,\n    "relevanceDirectness":0,\n    "naturalnessSpontaneity":0,\n    "deliveryPacing":0\n  },\n  "criterionFeedback":{\n    "fluencyCoherence":{"verdict":"","evidence":"","nextStep":""},\n    "lexicalResource":{"verdict":"","evidence":"","nextStep":""},\n    "grammar":{"verdict":"","evidence":"","nextStep":""},\n    "pronunciation":{"verdict":"","evidence":"","nextStep":""},\n    "ideaDevelopment":{"verdict":"","evidence":"","nextStep":""},\n    "rel   function extractGeminiText(payload) {
    const parts = payload?.candidates?.[0]?.content?.parts;
    if (!Array.isArray(parts)) return '';

  function parseAssessmentText(text) {
    const cleaned = String(text || '').replace(/^```(?:json)?\s*/i, '').replace(/\s*```$/i, '').trim();
    try { return JSON.parse(cleaned); }
    catch {
      const start = cleaned.indexOf('{'), end = cleaned.lastIndexOf('}');
      if (start >= 0 && end > start) return JSON.parse(cleaned.slice(start, end + 1));
      throw new Error('Gemini returned an unreadable assessment. Tap AI grade again.');
    }
  }

  async function grade() {
    if (!state.wavBlob || !state.metrics) return toast('Record an answer first.');
    if (!navigator.onLine) return toast('AI grading needs an internet connection.');

    if (!apiKey) apiKey = askForApiKey(true);
    if (!apiKey) return toast('Add a Gemini API key first.');

    els.retryBtn.disabled = true;
    els.gradeStatus.textContent = 'Sending audio directly to Gemini and grading…';
    try {
      const audioBase64 = await blobToBase64(state.wavBlob);
      const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(GEMINI_MODEL)}:generateContent`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'x-goog-api-key': apiKey },
        body: JSON.stringify({
          contents: [{ role: 'user', parts: [
            { text: buildAssessmentPrompt() },
            { inlineData: { mimeType: 'audio/wav', data: audioBase64 } }
          ] }],
          generationConfig: { responseMimeType: 'application/json', temperature: 0.15 }
        })
      });
      const payload = await response.json().catch(() => ({}));
      if (!response.ok) {
        const message = payload?.error?.message || `Gemini request failed (${response.status}).`;
        updateApiKeyButton();
        throw new Error(message);
      }
      const rawText = extractGeminiText(payload);
      if (!rawText) throw new Error('Gemini returned no assessment.');
      const result = sanitizeResult(parseAssessmentText(rawText));
      state.lastResult = result;
      renderResult(result);
      saveHistory(result);
      els.gradeStatus.textContent = 'Grading complete.';
      els.resultSection.scrollIntoView({ behavior: 'smooth', block: 'start' });
    } catch (err) {
      els.gradeStatus.textContent = '';
      toast(err?.message || 'Could not grade this answer.');
    } finally {
      els.gradeBtn.disabled = false;
      els.retryBtn.disabled = false;
    }
  }

  function sanitizeResult(r) {
    const number = (x, fallback = 0) => Number.isFinite(Number(x)) ? Number(x) : fallback;
    const arr = (x) => Array.isArray(x) ? x : [];
    const feedback = (x) => ({
      verdict: String(x?.verdict || '').trim(),
      evidence: String(x?.evidence || '').trim(),
      nextStep: String(x?.nextStep || '').trim()
    });
    return {
      transcript: String(r.transcript || '').trim(),
      summary: String(r.summary || '').trim(),
      estimatedBand: clamp(number(r.estimatedBand, 0), 0, 9),
      overallScore: clamp(number(r.overallScore, 0), 0, 100),
      scores: {
        fluencyCoherence: clamp(number(r.scores?.fluencyCoherence, 0), 0, 9),
        lexicalResource: clamp(number(r.scores?.lexicalResource, 0), 0, 9),
        grammar: clamp(number(r.scores?.grammar, 0), 0, 9),
        pronunciation: clamp(number(r.scores?.pronunciation, 0), 0, 9),
        ideaDevelopment: clamp(number(r.scores?.ideaDevelopment, r.scores?.ideaClarity ?? 0), 0, 9),
        relevanceDirectness: clamp(number(r.scores?.relevanceDirectness, 0), 0, 9),
        naturalnessSpontaneity: clamp(number(r.scores?.naturalnessSpontaneity, 0), 0, 9),
        deliveryPacing: clamp(number(r.scores?.deliveryPacing, 0), 0, 9)
      },
      criterionFeedback: {
        fluencyCoherence: feedback(r.criterionFeedback?.fluencyCoherence),
        lexicalResource: feedback(r.criterionFeedback?.lexicalResource),
        grammar: feedback(r.criterionFeedback?.grammar),
        pronunciation: feedback(r.criterionFeedback?.pronunciation),
        ideaDevelopment: feedback(r.criterionFeedback?.ideaDevelopment),
        relevanceDirectness: feedback(r.criterionFeedback?.relevanceDirectness),
        naturalnessSpontaneity: feedback(r.criterionFeedback?.naturalnessSpontaneity),
        deliveryPacing: feedback(r.criterionFeedback?.deliveryPacing)
      },
      pronunciationDetails: {
        intelligibility: String(r.pronunciationDetails?.intelligibility || '').trim(),
        soundsFinals: String(r.pronunciationDetails?.soundsFinals || '').trim(),
        stressRhythm: String(r.pronunciationDetails?.stressRhythm || '').trim(),
        connectedSpeech: String(r.pronunciationDetails?.connectedSpeech || '').trim()
      },
      strengths: arr(r.strengths).slice(0, 5).map(String),
      issues: arr(r.issues).slice(0, 8).map(i => ({ title: String(i?.title || 'Issue'), evidence: String(i?.evidence || ''), fix: String(i?.fix || '') })),
      betterAnswer: String(r.betterAnswer || '').trim(),
      band9Answer: String(r.band9Answer || '').trim(),
      fillerWords: arr(r.fillerWords).slice(0, 20).map(String),
      wordCount: Math.max(0, Math.round(number(r.wordCount, countWords(r.transcript || ''))))
    };
  }

  function countWords(text) { return (String(text).trim().match(/[A-Za-zÀ-ÖØ-öø-ÿ0-9']+/g) || []).length; }

  function renderResult(r) {
    els.resultSection.classList.remove('hidden');
    document.body.classList.add('results-open');
    els.resultHeadline.textContent = `${Math.round(r.overallScore)}/100 · ${modeLabel(state.mode)}`;
    const wordCount = r.wordCount || countWords(r.transcript);
    const wpm = state.metrics?.speechSpan > 0 ? Math.round(wordCount / (state.metrics.speechSpan / 60)) : 0;
    els.resultSummary.textContent = r.summary || 'Detailed speaking assessment.';
    els.bandScore.textContent = r.estimatedBand ? r.estimatedBand.toFixed(1).replace('.0','') : '—';

    const criteria = [
      ['Fluency & coherence', 'fluencyCoherence'],
      ['Lexical resource', 'lexicalResource'],
      ['Grammar range & accuracy', 'grammar'],
      ['Pronunciation', 'pronunciation'],
      ['Idea development', 'ideaDevelopment'],
      ['Relevance & directness', 'relevanceDirectness'],
      ['Naturalness & spontaneity', 'naturalnessSpontaneity'],
      ['Delivery & pacing', 'deliveryPacing']
    ];
    els.scoreGrid.innerHTML = criteria.map(([label,key]) => `<div class="score-tile"><span>${escapeHtml(label)}</span><strong>${Number(r.scores[key]).toFixed(1).replace('.0','')}</strong></div>`).join('');

    const m = state.metrics || {};
    const delivery = [
      ['Response', m.responseLatency == null ? '—' : `${m.responseLatency.toFixed(2)}s`],
      ['WPM', wpm || '—'],
      ['Long pauses', m.longPauses ?? '—'],
      ['Silence', m.silenceRatio == null ? '—' : `${Math.round(m.silenceRatio * 100)}%`],
      ['Words', wordCount || '—'],
      ['Fillers', r.fillerWords.length ? r.fillerWords.length : '0']
    ];
    els.deliveryMetrics.innerHTML = delivery.map(([label,value]) => `<div class="delivery-item"><span>${escapeHtml(label)}</span><strong>${escapeHtml(String(value))}</strong></div>`).join('');

    els.criterionFeedback.innerHTML = criteria.map(([label,key]) => {
      const f = r.criterionFeedback[key] || {};
      const verdict = f.verdict || 'No detailed verdict returned.';
      const evidence = f.evidence ? `<p class="evidence">Evidence: “${escapeHtml(f.evidence)}”</p>` : '';
      const next = f.nextStep ? `<p class="next-step"><b>Next:</b> ${escapeHtml(f.nextStep)}</p>` : '';
      return `<div class="criterion-row"><div class="criterion-top"><strong>${escapeHtml(label)}</strong><b>${Number(r.scores[key]).toFixed(1).replace('.0','')}</b></div><p>${escapeHtml(verdict)}</p>${evidence}${next}</div>`;
    }).join('') + pronunciationDetailHtml(r.pronunciationDetails);

    els.transcriptText.textContent = r.transcript || 'No transcript returned.';
    els.strengthList.innerHTML = r.strengths.length ? r.strengths.map(x => `<li>${escapeHtml(x)}</li>`).join('') : '<li>No clear strengths returned.</li>';
    els.issueList.innerHTML = r.issues.length ? r.issues.map(i => `<div class="issue"><strong>${escapeHtml(i.title)}</strong>${i.evidence ? `<p class="evidence">“${escapeHtml(i.evidence)}”</p>` : ''}${i.fix ? `<p>${escapeHtml(i.fix)}</p>` : ''}</div>`).join('') : '<div class="empty">No major issue returned.</div>';
    els.betterAnswer.textContent = r.betterAnswer || '—';
    els.band9Answer.textContent = r.band9Answer || '—';
  }

  function pronunciationDetailHtml(p = {}) {
    const rows = [
      ['Intelligibility', p.intelligibility],
      ['Sounds & final consonants', p.soundsFinals],
      ['Stress & rhythm', p.stressRhythm],
      ['Connected speech', p.connectedSpeech]
    ].filter(([,v]) => v);
    if (!rows.length) return '';
    return `<div class="criterion-row"><div class="criterion-top"><strong>Pronunciation breakdown</strong><b>Audio</b></div>${rows.map(([k,v]) => `<p><b>${escapeHtml(k)}:</b> ${escapeHtml(v)}</p>`).join('')}</div>`;
  }

  function modeLabel(mode) {
    return ({ instant: 'Instant', random: 'Random', ielts: `IELTS Part ${currentIeltsPart()}`, thought: 'Thought → Speech' })[mode] || mode;
  }

  function getHistory() {
    try { return JSON.parse(localStorage.getItem(HISTORY_KEY) || '[]'); }
    catch { return []; }
  }

  function saveHistory(r) {
    const history = getHistory();
    history.unshift({
      at: Date.now(), mode: state.mode, ieltsPart: state.mode === 'ielts' ? currentIeltsPart() : null,
      question: state.prompt, band: r.estimatedBand, overall: r.overallScore,
      latency: state.metrics?.responseLatency, pauses: state.metrics?.longPauses,
      fc: r.scores.fluencyCoherence, vocab: r.scores.lexicalResource, grammar: r.scores.grammar, pronunciation: r.scores.pronunciation
    });
    localStorage.setItem(HISTORY_KEY, JSON.stringify(history.slice(0, MAX_HISTORY)));
    renderHistory();
  }

  function avg(list, key) {
    const vals = list.map(x => Number(x[key])).filter(Number.isFinite);
    return vals.length ? vals.reduce((a,b) => a+b,0) / vals.length : null;
  }

  function renderHistory() {
    const history = getHistory();
    const recent = history.slice(0, 20);
    const aBand = avg(recent, 'band'), aOverall = avg(recent, 'overall');
    const latencies = recent.map(x => Number(x.latency)).filter(Number.isFinite);
    const pauses = recent.map(x => Number(x.pauses)).filter(Number.isFinite);
    const stats = [
      ['Sessions', String(history.length)],
      ['Avg band', aBand == null ? '—' : aBand.toFixed(1)],
      ['Avg score', aOverall == null ? '—' : Math.round(aOverall)],
      ['Avg latency', latencies.length ? `${(latencies.reduce((a,b)=>a+b,0)/latencies.length).toFixed(2)}s` : '—']
    ];
    els.progressStats.innerHTML = stats.map(([k,v]) => `<div class="progress-stat"><span>${k}</span><strong>${v}</strong></div>`).join('');
    if (!history.length) {
      els.historyList.innerHTML = '<div class="empty">No graded sessions yet. Your last 60 results will be stored only on this device.</div>';
      return;
    }
    els.historyList.innerHTML = history.slice(0, 10).map(h => {
      const d = new Date(h.at);
      const date = d.toLocaleDateString(undefined, { month:'short', day:'numeric' });
      const score = h.band ? `B${Number(h.band).toFixed(1).replace('.0','')}` : `${Math.round(h.overall)}`;
      return `<div class="history-row"><div class="date">${escapeHtml(date)} · ${escapeHtml(h.mode)}</div><div class="q" title="${escapeHtml(h.question)}">${escapeHtml(h.question)}</div><div class="score">${escapeHtml(score)}</div></div>`;
    }).join('');
  }

  function toast(message) {
    els.toast.textContent = message;
    els.toast.classList.add('show');
    clearTimeout(toast._t);
    toast._t = setTimeout(() => els.toast.classList.remove('show'), 3500);
  }

  function wire() {
    $$('.mode-card').forEach(btn => btn.addEventListener('click', () => setMode(btn.dataset.mode)));
    els.randomBtn.addEventListener('click', () => setPrompt());
    els.ieltsPart.addEventListener('change', () => { if (currentIeltsPart() === 2 && Number(els.timeLimit.value) < 90) els.timeLimit.value = '120'; updateMicrocopy(); setPrompt(); });
    els.timeLimit.addEventListener('change', () => { if (!state.recording && !state.countdown) { state.secondsLeft = Number(els.timeLimit.value); els.timer.textContent = formatTime(state.secondsLeft); } });
    els.recordBtn.addEventListener('click', startFlow);
    els.retryBtn.addEventListener('click', () => resetRecordingUI(true));
    els.gradeBtn.addEventListener('click', grade);
    els.samePromptBtn.addEventListener('click', () => { resetRecordingUI(true); $('.practice-card').scrollIntoView({ behavior:'smooth', block:'start' }); });
    els.nextPromptBtn.addEventListener('click', () => { setPrompt(); $('.practice-card').scrollIntoView({ behavior:'smooth', block:'start' }); });
    els.clearHistoryBtn.addEventListener('click', () => {
      if (!getHistory().length) return;
      if (confirm('Clear all locally stored speaking results on this device?')) { localStorage.removeItem(HISTORY_KEY); renderHistory(); }
    });

    els.apiKeyBtn.addEventListener('click', () => askForApiKey(true));
  }
  wire(); updateApiKeyButton(); renderHistory(); updateMicrocopy(); setPrompt();
})();

  </script>
</body>
</html>
